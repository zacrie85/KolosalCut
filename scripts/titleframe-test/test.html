<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  body { margin:0; background:#202028; font-family:sans-serif; }
  .grid { display:grid; grid-template-columns:repeat(5, 260px); gap:10px; padding:10px; }
  .cell { background:#000; border-radius:8px; overflow:hidden; }
  canvas { display:block; width:260px; height:462px; }
  .lbl { color:#9fb4d8; font-size:11px; padding:3px 7px; background:#111118; }
</style></head>
<body>
<div class="grid" id="g"></div>
<script src="./engine.module.js"></script>
<script>
const ids = ["t1","t2","t3","t4","t5","t6","f1","f2","f3","f4"];
const g = document.getElementById("g");
const W = 1080, H = 1920; // layar 9:16 asli KolosalCut
for (const id of ids) {
  const cell = document.createElement("div");
  cell.className = "cell";
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const lbl = document.createElement("div");
  lbl.className = "lbl"; lbl.textContent = id;
  cell.appendChild(cv); cell.appendChild(lbl);
  g.appendChild(cell);

  const ctx = cv.getContext("2d");
  // latar adegan (dummy video)
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#26466e"); bg.addColorStop(0.55,"#3d2f63"); bg.addColorStop(1,"#0b0d14");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "rgba(255,196,88,0.9)";
  ctx.beginPath(); ctx.arc(W*0.7, H*0.3, H*0.16, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(W*0.3,H*0.62); ctx.lineTo(W*0.55,H); ctx.closePath(); ctx.fill();

  // contoh teks judul beda panjang utk uji auto-size bingkai
  const title = id === "t5" ? "PETUALANGAN SANG KSATRIA" : (id === "f2" ? "JUDUL" : "JUDUL VIDEO UJI");
  const desc = id === "t4" ? "Kisah epik nusantara" : undefined;
  // panggil drawTextOverlay ASLI (posV 0.5 = tengah utk demo bingkai)
  NovaDraw.drawTextOverlay(ctx, W, H, {
    content: title,
    sub: desc,
    size: 0.042,
    subSize: 0.026,
    color: "#ffffff",
    font: "condensed",
    subFont: "condensed",
    anim: "fade",
    pos: "top",
    bg: "none",
    stroke: true,
    posV: 0.42,
    frame: id,
    frameW: 1,
    frameH: 1,
  }, 10, 0.2, 12);
}
document.title = "DONE";
</script>
</body>
</html>
