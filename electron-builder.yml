appId: app.kolosalcut.desktop
productName: KolosalCut
directories:
  output: release
  buildResources: build
asar: true
files:
  - electron/main.js
  - package.json
extraResources:
  # Binary FFmpeg/FFprobe Windows (diunduh oleh CI, tidak ikut repo)
  - from: resources/bin
    to: bin
  # Font sinematik untuk teks pada video
  - from: resources/fonts
    to: fonts
  # Overlay frame neon (animasi) & minimalis
  - from: resources/overlays
    to: overlays
  # Ikon untuk jendela aplikasi
  - from: build/icon.ico
    to: app.ico
  # Server Next.js standalone — dikemas sebagai SATU file zip oleh scripts/post-build.mjs.
  # PENTING (v1.1.1): electron-builder MENG-SKIP folder node_modules pada extraResources
  # (walau diberi filter) -> penyebab MODULE_NOT_FOUND server.js:16 di v1.0.0 & v1.1.0.
  # Dengan 1 file zip, copier electron-builder tidak pernah menyentuh node_modules;
  # ekstraksi dilakukan electron/main.js saat aplikasi pertama kali dibuka.
  - from: resources/app-standalone.zip
    to: app-standalone.zip
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  runAfterFinish: true
  artifactName: KolosalCut-Setup-${version}.exe
portable:
  artifactName: KolosalCut-Portable-${version}.exe
compression: maximum
