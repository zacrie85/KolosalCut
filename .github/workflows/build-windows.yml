name: Build Windows

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Node.js 22 (dengan cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instal dependensi (npm ci)
        run: npm ci
        env:
          # lewati unduh binary electron — electron-builder mengunduh versinya sendiri
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Unduh FFmpeg & FFprobe (build Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/bin | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "Mengunduh FFmpeg..."
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Write-Host "Ekstrak arsip..."
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $ffmpeg = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName resources/bin/ffmpeg.exe
          Copy-Item $ffprobe.FullName resources/bin/ffprobe.exe
          Write-Host "FFmpeg siap dibundel."

      - name: Build Next.js (standalone)
        run: npm run build

      - name: Uji server standalone sebelum dipaketkan
        shell: pwsh
        run: |
          $env:PORT = "3999"
          $env:HOSTNAME = "127.0.0.1"
          $env:NODE_ENV = "production"
          $p = Start-Process node -ArgumentList ".next/standalone/server.js" -PassThru -WindowStyle Hidden -RedirectStandardOutput server-out.log -RedirectStandardError server-err.log
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:3999/" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            Write-Host "=== server-err.log ==="; Get-Content server-err.log -ErrorAction SilentlyContinue
            Write-Host "=== server-out.log ==="; Get-Content server-out.log -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Server standalone MERESPONS 200 - paket aman untuk dipaketkan."

      - name: Paket instalasi Windows (Electron Builder)
        run: npx electron-builder --win nsis portable

      - name: Baca versi aplikasi
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Unggah artefak build
        uses: actions/upload-artifact@v4
        with:
          name: KolosalCut-Windows-x64
          path: release/*.exe
          if-no-files-found: error

      - name: Rilis GitHub (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KolosalCut ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release/*.exe
