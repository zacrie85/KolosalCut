name: Build Windows

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Node.js 22 (dengan cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instal dependensi (npm ci)
        run: npm ci

      - name: Pastikan binary Electron tersedia (untuk uji runtime paketan)
        run: node node_modules/electron/install.js

      - name: Unduh FFmpeg & FFprobe (build Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/bin | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "Mengunduh FFmpeg..."
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Write-Host "Ekstrak arsip..."
          Expand-Archive -Path "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $ffmpeg = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName resources/bin/ffmpeg.exe
          Copy-Item $ffprobe.FullName resources/bin/ffprobe.exe
          Write-Host "FFmpeg siap dibundel."

      - name: Unduh mesin & model Whisper — teks otomatis (v1.3.3)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/models | Out-Null
          $tag = "b5454"
          Write-Host "Mengunduh whisper-cli (whisper.cpp $tag)..."
          Invoke-WebRequest -Uri "https://github.com/ggml-org/whisper.cpp/releases/download/$tag/whisper-bin-x64.zip" -OutFile "$env:RUNNER_TEMP\whisper.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\whisper.zip" -DestinationPath "$env:RUNNER_TEMP\whisper" -Force
          $cli = Get-ChildItem -Path "$env:RUNNER_TEMP\whisper" -Recurse -Filter "whisper-cli.exe" | Select-Object -First 1
          if (-not $cli) { Write-Host "=== isi zip ==="; Get-ChildItem -Recurse "$env:RUNNER_TEMP\whisper" | Select-Object FullName; throw "whisper-cli.exe tidak ditemukan di zip" }
          Copy-Item $cli.FullName resources/bin/whisper-cli.exe
          # salin semua DLL pendamping (whisper.dll, SDL2.dll, dst.)
          Get-ChildItem -Path "$env:RUNNER_TEMP\whisper" -Recurse -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName resources/bin/ -Force }
          Write-Host "Mengunduh model suara Bahasa Indonesia (q5_1)..."
          foreach ($m in @("tiny","base","small")) {
            $f = "ggml-$m-q5_1.bin"
            Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$f" -OutFile "resources/models/$f"
          }
          Write-Host "=== resources/bin ==="; Get-ChildItem resources/bin | Format-Table Name, Length
          Write-Host "=== resources/models ==="; Get-ChildItem resources/models | Format-Table Name, Length

      - name: Gerbang uji whisper-cli sebelum dipaketkan
        shell: pwsh
        run: |
          # PENTING: jangan pipa langsung ke Select-Object -First — pipeline terpotong
          # membuat proses dihentikan lebih awal dan $LASTEXITCODE kosong sehingga
          # gerbang salah gagal (bug CI v1.3.3 pertama). Tangkap penuh -> cek kode ->
          # baru tampilkan sebagian output.
          $out = & resources/bin/whisper-cli.exe --help 2>&1
          $code = $LASTEXITCODE
          Write-Host ($out | Select-Object -First 3)
          if ($code -ne 0) { throw "whisper-cli.exe gagal dijalankan (kode $code)" }
          # sanity: pastikan ketiga model terunduh utuh (bukan HTML error / terpotong)
          Get-ChildItem resources/models/*.bin | ForEach-Object {
            if ($_.Length -lt 20MB) { throw "model suara rusak/kekecilan: $($_.Name) ($($_.Length) byte)" }
            Write-Host ("model OK: {0} ({1} MB)" -f $_.Name, [math]::Round($_.Length/1MB))
          }
          Write-Host "whisper-cli OK"

      - name: Build Next.js (standalone)
        run: npm run build

      - name: Uji server standalone sebelum dipaketkan
        shell: pwsh
        run: |
          $env:PORT = "3999"
          $env:HOSTNAME = "127.0.0.1"
          $env:NODE_ENV = "production"
          $p = Start-Process node -ArgumentList ".next/standalone/server.js" -PassThru -WindowStyle Hidden -RedirectStandardOutput server-out.log -RedirectStandardError server-err.log
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:3999/" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          if (-not $ok) {
            Write-Host "=== server-err.log ==="; Get-Content server-err.log -ErrorAction SilentlyContinue
            Write-Host "=== server-out.log ==="; Get-Content server-out.log -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Server standalone MERESPONS 200 - paket aman untuk dipaketkan."

      - name: Paket instalasi Windows (Electron Builder)
        run: npx electron-builder --win nsis portable --publish never

      - name: Uji server HASIL PAKETAN via runtime Electron (gerbang anti MODULE_NOT_FOUND)
        shell: pwsh
        run: node scripts/test-packaged-server.mjs

      - name: Baca versi aplikasi
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Unggah artefak build
        uses: actions/upload-artifact@v4
        with:
          name: KolosalCut-Windows-x64
          path: release/*.exe
          if-no-files-found: error

      - name: Rilis GitHub (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KolosalCut ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release/*.exe
